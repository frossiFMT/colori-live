<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colori Live</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Colori Live">
<meta name="theme-color" content="#000000">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  #view{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #cv{max-width:100%;max-height:100%;display:block}
  video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  #top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#000a,#0000);font-size:13px}
  #fps{opacity:.7;font-variant-numeric:tabular-nums}
  #msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000c;padding:14px 18px;border-radius:14px;text-align:center;max-width:80%;font-size:15px;line-height:1.4}
  #panel{background:#111;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:grid;gap:8px}
  .row{display:flex;align-items:center;gap:10px;min-height:40px}
  .lab{width:92px;font-size:12px;color:#aaa;flex:none}
  .lab b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .sw{width:36px;height:36px;border-radius:9px;border:1px solid #fff3;flex:none;background:#222;transition:background .25s}
  .nm{font-size:17px;font-weight:600}
  .meta{font-size:11px;color:#999;font-variant-numeric:tabular-nums}
  .ctrls{display:flex;gap:8px;margin-top:2px}
  button{flex:1;background:#2a2a2a;color:#fff;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:600}
  button.on{background:#1f7a5c}
  #start{position:absolute;left:50%;top:58%;transform:translateX(-50%);background:#1f7a5c;padding:15px 26px;border-radius:14px;font-size:17px;flex:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="view">
    <canvas id="cv"></canvas>
    <video id="vid" playsinline muted autoplay></video>
    <div id="top"><span>Colori Live</span><span id="fps"></span></div>
    <div id="msg">Carico il modello…</div>
    <button id="start" style="display:none">Avvia telecamera</button>
  </div>
  <div id="panel">
    <div id="rows"></div>
    <div class="ctrls">
      <button id="bFlip">🔄 Cambia camera</button>
      <button id="bPause">⏸ Blocca</button>
    </div>
  </div>
</div>

<script src="mp/pose.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const msg = t => { const m=$('msg'); if(t){m.textContent=t;m.style.display='block';} else m.style.display='none'; };

/* ================= colori ================= */
function lin(c){ c/=255; return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
function rgb2lab(r,g,b){
  const R=lin(r),G=lin(g),B=lin(b);
  let x=(R*0.4124+G*0.3576+B*0.1805)/0.95047, y=R*0.2126+G*0.7152+B*0.0722, z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):(7.787*t+16/116); x=f(x);y=f(y);z=f(z);
  return [116*y-16,500*(x-y),200*(y-z)];
}
const hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const fromHex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const PALETTE=[
  ['nero','#161616'],['grigio scuro','#474747'],['grigio','#8a8a8a'],['grigio chiaro','#c4c4c4'],['bianco','#f3f3f3'],
  ['panna','#ece3cf'],['beige','#d2b98c'],['kaki','#a69a6c'],['marrone chiaro','#a47148'],['marrone','#6b4226'],['marrone scuro','#3b2718'],
  ['rosso','#c0262d'],['bordeaux','#6a1a2a'],['rosa','#f0a7ba'],['rosa antico','#c98b93'],['fucsia','#cf2f80'],
  ['arancione','#e8792b'],['corallo','#f07f6a'],['giallo','#f0cf2f'],['senape','#c39d24'],
  ['verde chiaro','#8fd17a'],['verde','#2f8f46'],['verde scuro','#1e472b'],['verde oliva','#64662e'],['verde acqua','#3fb6a8'],
  ['azzurro','#7fbde8'],['blu','#2a4fa8'],['blu navy','#1b2645'],['blu jeans','#4a6a90'],['jeans chiaro','#7f9bbd'],
  ['viola','#6b3fa0'],['lilla','#b9a2d8'],['turchese','#1aa6c0']
].map(([n,h])=>({n,lab:rgb2lab(...fromHex(h))}));
function colourName(rgb){
  const lab=rgb2lab(...rgb); let best=null,bd=1e9;
  for(const p of PALETTE){const dL=(lab[0]-p.lab[0])*0.8,da=lab[1]-p.lab[1],db=lab[2]-p.lab[2],d=dL*dL+da*da+db*db; if(d<bd){bd=d;best=p;}}
  return best.n;
}
function isSkin(r,g,b){ const Y=0.299*r+0.587*g+0.114*b, Cr=(r-Y)*0.713+128, Cb=(b-Y)*0.564+128; return Cr>=136&&Cr<=173&&Cb>=77&&Cb<=127&&r>g&&Y>45; }

function kmeans(px,k=3,iters=6){
  if(px.length<k) k=Math.max(1,px.length);
  const labs=px.map(p=>rgb2lab(p[0],p[1],p[2]));
  const cent=[labs[labs.length>>1].slice()];
  while(cent.length<k){
    let far=-1,fi=0;
    for(let i=0;i<labs.length;i+=2){let m=1e9;for(const c of cent){const d=(labs[i][0]-c[0])**2+(labs[i][1]-c[1])**2+(labs[i][2]-c[2])**2;if(d<m)m=d;} if(m>far){far=m;fi=i;}}
    cent.push(labs[fi].slice());
  }
  const asg=new Int32Array(labs.length);
  for(let it=0;it<iters;it++){
    for(let i=0;i<labs.length;i++){let m=1e9,mi=0;for(let c=0;c<k;c++){const d=(labs[i][0]-cent[c][0])**2+(labs[i][1]-cent[c][1])**2+(labs[i][2]-cent[c][2])**2;if(d<m){m=d;mi=c;}}asg[i]=mi;}
    const s=Array.from({length:k},()=>[0,0,0,0]);
    for(let i=0;i<labs.length;i++){const a=s[asg[i]];a[0]+=labs[i][0];a[1]+=labs[i][1];a[2]+=labs[i][2];a[3]++;}
    for(let c=0;c<k;c++) if(s[c][3]) cent[c]=[s[c][0]/s[c][3],s[c][1]/s[c][3],s[c][2]/s[c][3]];
  }
  const out=Array.from({length:k},()=>({n:0,r:0,g:0,b:0}));
  for(let i=0;i<px.length;i++){const o=out[asg[i]];o.n++;o.r+=px[i][0];o.g+=px[i][1];o.b+=px[i][2];}
  return out.filter(o=>o.n).map(o=>{const rgb=[o.r/o.n,o.g/o.n,o.b/o.n];return {rgb,pct:o.n/px.length,skin:isSkin(...rgb)};}).sort((a,b)=>b.pct-a.pct);
}

/* ================= geometria ================= */
function segPoly(a,b,hw,trim=0.12){
  const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
  const p0={x:a.x+dx*trim,y:a.y+dy*trim},p1={x:b.x-dx*trim,y:b.y-dy*trim};
  return [{x:p0.x+nx*hw,y:p0.y+ny*hw},{x:p1.x+nx*hw,y:p1.y+ny*hw},{x:p1.x-nx*hw,y:p1.y-ny*hw},{x:p0.x-nx*hw,y:p0.y-ny*hw}];
}
function shrink(p,f){const cx=p.reduce((s,q)=>s+q.x,0)/p.length,cy=p.reduce((s,q)=>s+q.y,0)/p.length;return p.map(q=>({x:cx+(q.x-cx)*f,y:cy+(q.y-cy)*f}));}
function inPoly(x,y,p){let ins=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i].x,yi=p[i].y,xj=p[j].x,yj=p[j].y;if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}

const REG=[
  {key:'Maglia',col:'#ffcc00'},
  {key:'Pantaloni',col:'#00d0ff'},
  {key:'Scarpe',col:'#ff4fa0'}
];
// costruisce i poligoni in coordinate normalizzate (0..1) moltiplicate per W,H
function buildRegions(lm,W,H){
  const L=lm.map(p=>({x:p.x*W,y:p.y*H,v:p.visibility??1}));
  const vis=(...ids)=>ids.every(i=>L[i]&&L[i].v>0.5&&L[i].x>=0&&L[i].x<=W&&L[i].y>=0&&L[i].y<=H);
  const hipW=Math.hypot(L[23].x-L[24].x,L[23].y-L[24].y), shW=Math.hypot(L[11].x-L[12].x,L[11].y-L[12].y);
  const out={Maglia:[],Pantaloni:[],Scarpe:[]};
  if(vis(11,12,23,24)){
    const t=(a,b)=>({x:a.x+(b.x-a.x)*0.15,y:a.y+(b.y-a.y)*0.15});
    out.Maglia.push(shrink([t(L[11],L[23]),t(L[12],L[24]),L[24],L[23]],0.72));
  }
  const hw=Math.max(hipW*0.18,shW*0.1,2);
  if(vis(23,25)) out.Pantaloni.push(segPoly(L[23],L[25],hw));
  if(vis(24,26)) out.Pantaloni.push(segPoly(L[24],L[26],hw));
  if(vis(25,27)) out.Pantaloni.push(segPoly(L[25],L[27],hw*0.75));
  if(vis(26,28)) out.Pantaloni.push(segPoly(L[26],L[28],hw*0.75));
  [[27,29,31],[28,30,32]].forEach(([a,h,t])=>{ if(vis(a,h,t)) out.Scarpe.push(shrink([L[a],L[h],L[t]],0.85)); });
  return out;
}

/* ================= stato e UI ================= */
const state={}; // per regione: {rgb (EMA), skin (EMA), seen (timestamp), label}
REG.forEach(r=>state[r.key]={rgb:null,skin:0,seen:0});
$('rows').innerHTML=REG.map(r=>`<div class="row" id="r-${r.key}"><div class="lab"><b style="background:${r.col}"></b><span class="lb">${r.key}</span></div><div class="sw"></div><div><div class="nm">—</div><div class="meta">non visibile</div></div></div>`).join('');

function updatePanel(now){
  for(const r of REG){
    const s=state[r.key], row=$('r-'+r.key);
    const fresh=now-s.seen<1200;
    let label=r.key;
    if(r.key==='Pantaloni'&&s.skin>0.3&&s.rgb) label='Pantaloncini / gonna';
    if(r.key==='Scarpe'&&s.skin>0.5) label='Piedi';
    row.querySelector('.lb').textContent=label;
    if(!fresh||(!s.rgb&&!s.skinOnly)){ row.querySelector('.nm').textContent='—'; row.querySelector('.meta').textContent='non visibile'; row.querySelector('.sw').style.background='#222'; continue; }
    if(!s.rgb||s.skinOnly){ row.querySelector('.nm').textContent='pelle scoperta'; row.querySelector('.meta').textContent='nessun indumento'; row.querySelector('.sw').style.background=s.skinRgb?hex(...s.skinRgb):'#222'; continue; }
    row.querySelector('.nm').textContent=colourName(s.rgb);
    row.querySelector('.meta').textContent=hex(...s.rgb).toUpperCase()+(s.skin>0.2?` · pelle ${Math.round(s.skin*100)}%`:'');
    row.querySelector('.sw').style.background=hex(...s.rgb);
  }
}

/* ================= pipeline ================= */
const cv=$('cv'), ctx=cv.getContext('2d');
const AW=224; // larghezza del fotogramma di analisi (piccolo = veloce)
const ac=document.createElement('canvas'), actx=ac.getContext('2d',{willReadFrequently:true});
const mc=document.createElement('canvas'), mctx=mc.getContext('2d',{willReadFrequently:true});
let pose=null, facing='environment', paused=false, stream=null, busy=false, lastPanel=0, fpsT=performance.now(), fpsN=0;
const video=$('vid');

function onResults(res){
  const img=res.image, W=img.width||video.videoWidth, H=img.height||video.videoHeight;
  if(!W||!H) return;
  const DW=Math.min(W,720), DH=Math.round(H*DW/W);
  if(cv.width!==DW||cv.height!==DH){cv.width=DW;cv.height=DH;}
  const mirror=facing==='user';
  ctx.save(); if(mirror){ctx.translate(DW,0);ctx.scale(-1,1);} ctx.drawImage(img,0,0,DW,DH); ctx.restore();

  const now=performance.now();
  fpsN++; if(now-fpsT>1000){$('fps').textContent=fpsN+' fps';fpsN=0;fpsT=now;}

  if(!res.poseLandmarks){ msg('Inquadra una persona intera'); maybePanel(now); return; }
  msg(null);

  // fotogramma di analisi ridotto
  const AH=Math.round(H*AW/W);
  if(ac.width!==AW||ac.height!==AH){ac.width=AW;ac.height=AH;mc.width=AW;mc.height=AH;}
  actx.drawImage(img,0,0,AW,AH);
  const px=actx.getImageData(0,0,AW,AH).data;
  let mask=null;
  if(res.segmentationMask){
    try{
      mctx.clearRect(0,0,AW,AH); mctx.drawImage(res.segmentationMask,0,0,AW,AH);
      const md=mctx.getImageData(0,0,AW,AH).data;
      let minA=255; for(let i=3;i<md.length;i+=40) if(md[i]<minA) minA=md[i];
      const ch=minA<250?3:0; mask=new Uint8Array(AW*AH); for(let i=0;i<AW*AH;i++) mask[i]=md[i*4+ch];
    }catch(e){mask=null;}
  }

  const regA=buildRegions(res.poseLandmarks,AW,AH);
  const regD=buildRegions(res.poseLandmarks,DW,DH);
  const fx=p=>mirror?DW-p.x:p.x;

  for(const r of REG){
    const polys=regA[r.key]; if(!polys.length) continue;
    const sample=[];
    for(const poly of polys){
      const xs=poly.map(p=>p.x),ys=poly.map(p=>p.y);
      const x0=Math.max(0,Math.floor(Math.min(...xs))),x1=Math.min(AW-1,Math.ceil(Math.max(...xs)));
      const y0=Math.max(0,Math.floor(Math.min(...ys))),y1=Math.min(AH-1,Math.ceil(Math.max(...ys)));
      for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
        if(!inPoly(x,y,poly)) continue; const i=y*AW+x;
        if(mask&&mask[i]<128) continue;
        sample.push([px[i*4],px[i*4+1],px[i*4+2]]);
      }
    }
    if(sample.length<12) continue;
    const step=Math.ceil(sample.length/500), sub=step>1?sample.filter((_,i)=>i%step===0):sample;
    const cl=kmeans(sub,3);
    const skinPct=cl.filter(c=>c.skin).reduce((a,c)=>a+c.pct,0);
    const cloth=cl.filter(c=>!c.skin&&c.pct>=0.12);
    const s=state[r.key], a=0.25;
    s.seen=now; s.skin=s.skin*(1-a)+skinPct*a;
    if(cloth.length){
      const c=cloth[0].rgb; s.skinOnly=false;
      // se il colore cambia molto (persona diversa) si aggiorna subito, altrimenti si smussa
      if(!s.rgb){s.rgb=c.slice();}
      else{const la=rgb2lab(...s.rgb),lb=rgb2lab(...c),d=Math.hypot(la[0]-lb[0],la[1]-lb[1],la[2]-lb[2]); const k=d>35?0.6:a; s.rgb=s.rgb.map((v,i)=>v*(1-k)+c[i]*k);}
    }else{ s.skinOnly=true; s.skinRgb=cl[0].rgb; }

    // disegno zone + etichetta
    ctx.lineWidth=Math.max(2,DW/240); ctx.strokeStyle=r.col; ctx.fillStyle=r.col+'2a';
    let sx=0,sy=0,n=0;
    for(const poly of regD[r.key]){
      ctx.beginPath(); poly.forEach((p,i)=>{const X=fx(p);i?ctx.lineTo(X,p.y):ctx.moveTo(X,p.y);sx+=X;sy+=p.y;n++;}); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    if(n){
      const name=s.skinOnly?'pelle':colourName(s.rgb), fs=Math.max(13,DW/30);
      ctx.font=`600 ${fs}px -apple-system,system-ui,sans-serif`;
      const tw=ctx.measureText(name).width, bx=sx/n-(tw+fs*1.6)/2, by=sy/n-fs*0.8;
      ctx.fillStyle='rgba(0,0,0,.72)'; roundRect(bx,by,tw+fs*1.8,fs*1.6,fs*0.4); ctx.fill();
      ctx.fillStyle=s.skinOnly?hex(...s.skinRgb):hex(...s.rgb); roundRect(bx+fs*0.3,by+fs*0.35,fs*0.9,fs*0.9,fs*0.2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.fillText(name,bx+fs*1.4,by+fs*0.82);
    }
  }
  maybePanel(now);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function maybePanel(now){ if(now-lastPanel>200){lastPanel=now;updatePanel(now);} }

async function loop(){
  if(!paused && pose && video.readyState>=2 && !busy){
    busy=true;
    try{ await pose.send({image:video}); }catch(e){ console.error(e); }
    busy=false;
  }
  requestAnimationFrame(loop);
}

async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}}});
  }catch(e){
    msg('Non posso usare la telecamera: '+(e.message||e.name)+'. Controlla il permesso in Impostazioni › Safari › Fotocamera.'); return false;
  }
  video.srcObject=stream; await video.play().catch(()=>{});
  return true;
}

async function init(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ msg('Questo browser non dà accesso alla telecamera. Apri la pagina in Safari tramite https.'); return; }
  if(typeof Pose==='undefined'){ msg('Libreria di visione non caricata.'); return; }
  pose=new Pose({locateFile:f=>'mp/'+f});
  pose.setOptions({modelComplexity:0,smoothLandmarks:true,enableSegmentation:true,smoothSegmentation:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
  pose.onResults(onResults);
  try{ await pose.initialize(); }catch(e){ msg('Errore nel caricare il modello: '+(e.message||e)); return; }
  msg('Pronto');
  // iOS richiede un tocco prima di avviare la camera in alcune situazioni
  const go=async()=>{ $('start').style.display='none'; msg('Avvio la telecamera…'); if(await startCamera()){ msg('Inquadra una persona intera'); loop(); } };
  $('start').style.display='block'; $('start').onclick=go;
}

$('bFlip').onclick=async()=>{ facing=facing==='environment'?'user':'environment'; REG.forEach(r=>{state[r.key].rgb=null;}); await startCamera(); };
$('bPause').onclick=()=>{ paused=!paused; $('bPause').textContent=paused?'▶︎ Riprendi':'⏸ Blocca'; $('bPause').classList.toggle('on',paused); if(paused) video.pause(); else video.play(); };

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
})();
</script>
</body>
</html>
